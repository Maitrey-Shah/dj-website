<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AWAARA">
  <!-- Dark premium background -->
  <rect width="64" height="64" rx="12" fill="#231208"/>
  <!-- Gradient overlay for depth -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#c2410c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#231208" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="url(#glow)"/>

  <!-- Sweeping orbit arc -->
  <path d="M 10 46 Q 32 56 54 38" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>
  <path d="M 10 46 Q 12 34 32 28 Q 50 22 54 38" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.85"/>

  <!-- 4-point star -->
  <g transform="translate(46,14)">
    <path d="M0,-7 C0.3,-2 0.3,0 0,0 C-0.3,0 -0.3,-2 0,-7Z" fill="white"/>
    <path d="M0,7 C0.3,2 0.3,0 0,0 C-0.3,0 -0.3,2 0,7Z" fill="white"/>
    <path d="M-7,0 C-2,0.3 0,0.3 0,0 C0,-0.3 -2,-0.3 -7,0Z" fill="white"/>
    <path d="M7,0 C2,0.3 0,0.3 0,0 C0,-0.3 2,-0.3 7,0Z" fill="white"/>
  </g>

  <!-- "A" initial mark — bold serif -->
  <text
    x="32" y="46"
    font-family="'Times New Roman',Georgia,serif"
    font-size="34"
    font-weight="900"
    fill="white"
    text-anchor="middle"
    dominant-baseline="auto"
  >A</text>
</svg>
