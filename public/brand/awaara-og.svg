<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="AWAARA — Premium Desi Events, Concerts and Nightlife in Canada">
  <defs>
    <!-- Deep dark background -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0806"/>
      <stop offset="100%" stop-color="#1c0e07"/>
    </linearGradient>
    <!-- Warm red/orange glow centred on logo -->
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#b45309" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#7c2d12" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f0806" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle vignette -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="60%" stop-color="#0f0806" stop-opacity="0"/>
      <stop offset="100%" stop-color="#050302" stop-opacity="0.8"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#vignette)"/>

  <!-- Decorative thin horizontal rule lines -->
  <line x1="60" y1="120" x2="1140" y2="120" stroke="white" stroke-width="0.6" opacity="0.12"/>
  <line x1="60" y1="510" x2="1140" y2="510" stroke="white" stroke-width="0.6" opacity="0.12"/>

  <!-- Corner accent marks -->
  <path d="M60,60 L60,100 M60,60 L100,60" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M1140,60 L1140,100 M1140,60 L1100,60" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M60,570 L60,530 M60,570 L100,570" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M1140,570 L1140,530 M1140,570 L1100,570" stroke="#c2410c" stroke-width="2" fill="none" opacity="0.8"/>

  <!-- AWAARA wordmark — centred, white -->
  <!-- Swoosh orbit arc -->
  <g transform="translate(220, 185)">
    <path
      d="M 48 148 C 20 168, 10 158, 22 138 C 46 100, 148 76, 302 76 C 436 76, 532 94, 566 116 C 580 124, 582 136, 568 142"
      stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.9"
    />
    <path
      d="M 568 142 C 554 152, 536 150, 524 142 C 492 120, 418 86, 302 80 C 172 74, 72 98, 46 126 C 36 138, 42 152, 48 148"
      stroke="white" stroke-width="2.8" fill="none" stroke-linecap="round" opacity="0.9"
    />
    <!-- 4-point star above RA junction -->
    <g transform="translate(450,36)">
      <path d="M0,-20 C1,-6 1,0 0,0 C-1,0 -1,-6 0,-20Z" fill="white"/>
      <path d="M0,20 C1,6 1,0 0,0 C-1,0 -1,6 0,20Z" fill="white"/>
      <path d="M-20,0 C-6,1 0,1 0,0 C0,-1 -6,-1 -20,0Z" fill="white"/>
      <path d="M20,0 C6,1 0,1 0,0 C0,-1 6,-1 20,0Z" fill="white"/>
    </g>
    <!-- Wordmark text -->
    <text
      x="18" y="130"
      font-family="'Times New Roman',Georgia,serif"
      font-size="126"
      font-weight="900"
      fill="white"
      letter-spacing="-2"
    >AWAARA</text>
  </g>

  <!-- Tagline -->
  <text
    x="600" y="448"
    font-family="'Arial','Helvetica Neue',sans-serif"
    font-size="22"
    font-weight="400"
    fill="white"
    text-anchor="middle"
    letter-spacing="5"
    opacity="0.7"
  >CANADA'S DESI ENTERTAINMENT EXPERIENCE</text>

  <!-- Red accent dot separator -->
  <circle cx="600" cy="478" r="3" fill="#c2410c" opacity="0.9"/>
  <line x1="560" y1="478" x2="590" y2="478" stroke="#c2410c" stroke-width="1" opacity="0.5"/>
  <line x1="610" y1="478" x2="640" y2="478" stroke="#c2410c" stroke-width="1" opacity="0.5"/>

  <!-- URL / domain hint -->
  <text
    x="600" y="548"
    font-family="'Arial','Helvetica Neue',sans-serif"
    font-size="16"
    fill="white"
    text-anchor="middle"
    letter-spacing="3"
    opacity="0.35"
  >AWAARA.CA</text>
</svg>
