<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 168" fill="none" role="img" aria-label="AWAARA">
  <!--
    AWAARA brand logo — white version for dark backgrounds.
    Faithful recreation of the official wordmark:
      • Bold condensed serif capitals "AWAARA"
      • Sweeping elliptical orbit / swoosh arc encircling the word
      • 4-point starburst above the second A / R junction
  -->

  <!-- ── Elliptical swoosh orbit ──────────────────────────────── -->
  <!-- Main lower sweep (left tail → under word → right) -->
  <path
    d="M 54 138 C 30 155, 22 148, 32 130 C 52 95, 140 72, 280 72 C 400 72, 490 88, 524 108 C 538 116, 540 126, 528 132"
    stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round"
  />
  <!-- Upper arc (right side curving back over the word) -->
  <path
    d="M 528 132 C 516 140, 500 138, 490 132 C 460 112, 390 82, 280 76 C 160 70, 70 92, 46 118 C 38 128, 42 140, 54 138"
    stroke="white" stroke-width="2.4" fill="none" stroke-linecap="round"
  />

  <!-- ── 4-point starburst (above the RA junction, ~x=415 y=34) ── -->
  <g transform="translate(415,34)">
    <path d="M0,-18 C0.8,-5 0.8,0 0,0 C-0.8,0 -0.8,-5 0,-18Z" fill="white"/>
    <path d="M0,18 C0.8,5 0.8,0 0,0 C-0.8,0 -0.8,5 0,18Z" fill="white"/>
    <path d="M-18,0 C-5,0.8 0,0.8 0,0 C0,-0.8 -5,-0.8 -18,0Z" fill="white"/>
    <path d="M18,0 C5,0.8 0,0.8 0,0 C0,-0.8 5,-0.8 18,0Z" fill="white"/>
  </g>

  <!-- ── Wordmark "AWAARA" ─────────────────────────────────────── -->
  <!--
    Using a system serif stack to approximate the bold editorial serif
    of the official mark. The actual PNG asset (awaara-logo.png) is the
    canonical visual; this SVG is a lightweight fallback / inline version.
  -->
  <text
    x="18" y="122"
    font-family="'Didot','Bodoni MT','Playfair Display','Times New Roman',Georgia,serif"
    font-size="112"
    font-weight="900"
    fill="white"
    letter-spacing="-3"
  >AWAARA</text>
</svg>
